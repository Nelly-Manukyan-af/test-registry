name: Push Alpine to Private Registry and Deploy to K8s

on:
  push:
    branches:
      - main

jobs:
  push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: registry.arctic-fox.tech
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull, Tag, and Push Alpine
        run: |
          docker pull alpine:latest
          docker tag alpine:latest registry.arctic-fox.tech/nelly/alpine-test:latest
          docker push registry.arctic-fox.tech/nelly/alpine-test:latest

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Ensure Image Pull Secret Exists
        run: |
          kubectl create secret docker-registry arctic-fox-registry-secret \
            --docker-server=registry.arctic-fox.tech \
            --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
            --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/alpine-test
          kubectl rollout status deployment/alpine-test --timeout=120s
